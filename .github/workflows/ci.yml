name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow against the tagged commit before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ghcr.io/gizmodata/hardcharger is pulled with this workflow's GITHUB_TOKEN (no personal token): the package
# grants this repository read access (package settings, Manage Actions access). The `driver` job builds
# adbc-driver-hardcharger from gizmodata/hardcharger-adbc at a pinned commit; that repository and the Go modules it
# needs are public, so they are fetched anonymously. Every other job installs the driver from that job's artifact.
# Anything missing FAILS; nothing is skipped.
env:
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main
  HARDCHARGER_ADBC_COMMIT: 460fcc179ad99cef0532d0ff7aab3b6cc4b29db3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check src tests

  driver:
    name: driver (adbc-driver-hardcharger)
    runs-on: ubuntu-latest
    steps:
      - name: gizmodata/hardcharger-adbc ${{ env.HARDCHARGER_ADBC_COMMIT }}
        run: |
          src="$RUNNER_TEMP/hardcharger-adbc"
          git init --quiet "$src"
          git -C "$src" remote add origin https://github.com/gizmodata/hardcharger-adbc.git
          git -C "$src" fetch --quiet --depth 1 origin "$HARDCHARGER_ADBC_COMMIT"
          git -C "$src" checkout --quiet FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$HARDCHARGER_ADBC_COMMIT"
          echo "SRC=$src" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ runner.temp }}/hardcharger-adbc/go/go.mod
          cache: false
      # The driver's own Linux build: zig targeting glibc 2.17, so the library loads in the Docker image too.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the sdist (no library; for unit tests on any OS) and the Linux wheel
        run: |
          pip install build
          python -m build --sdist --outdir "$RUNNER_TEMP/driver" "$SRC/python"
          VERSION=$(git -C "$SRC" rev-parse --short HEAD) "$SRC/scripts/build_lib.sh"
          cp "$SRC/go/build/libadbc_driver_hardcharger.so" "$SRC/python/src/adbc_driver_hardcharger/"
          python -m build --wheel --outdir "$RUNNER_TEMP/driver" "$SRC/python"
          ls -la "$RUNNER_TEMP/driver"
      - uses: actions/upload-artifact@v7
        with:
          name: hardcharger-driver
          path: ${{ runner.temp }}/driver/
          retention-days: 7

  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    needs: driver
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-driver
          path: driver
      # The unit tests stand in for the driver library, so the sdist (pure Python) does on every OS.
      - run: pip install -e ".[dev]" driver/adbc_driver_hardcharger-*.tar.gz
        shell: bash
      - run: pytest tests/unit -v

  lowest-dependencies:
    # The oldest versions pyproject.toml allows must really work.
    needs: driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-driver
          path: driver
      - run: uv venv --python 3.11
      - run: uv pip install --resolution lowest-direct -e ".[all]" "pytest>=8" driver/adbc_driver_hardcharger-*.tar.gz
      - run: uv pip list
      - run: .venv/bin/pytest tests/unit -v

  integration:
    name: integration (py${{ matrix.python }})
    needs: driver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    services: &services
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: replicate
          APP_USER_PASSWORD: replicate
        ports:
          - 15211:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: source
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-driver
          path: driver
      - run: pip install -e ".[dev]" driver/adbc_driver_hardcharger-*.whl
      # An unreachable server FAILS these tests (never skips), and pytest exits 5 if nothing ran.
      - run: pytest tests/integration -m integration -v
      - name: Hardcharger server log
        if: failure()
        run: docker logs hardcharger 2>&1 | tail -200

  python-3-15:
    # Python 3.15 is brand new: adbc-driver-manager and pyyaml build from source here, and DuckDB
    # has no 3.15 wheels yet, so this job covers the Oracle / PostgreSQL → Hardcharger path.
    needs: driver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services: *services
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-driver
          path: driver
      - run: pip install -e ".[oracle,postgresql]" "pytest>=8" driver/adbc_driver_hardcharger-*.whl
      - run: pytest tests/unit --ignore=tests/unit/test_views_duckdb.py -v
      - run: >-
          pytest tests/integration -m integration -v --ignore=tests/integration/test_duckdb_source.py
          --ignore=tests/integration/test_lossy_duckdb_types.py --ignore=tests/integration/test_hardcharger.py
          --deselect=tests/integration/test_readme_examples.py::test_duckdb_source_and_lossy_columns

  snowflake:
    # Needs credentials, so it doesn't run for pull requests (fork PRs get no secrets). Everywhere
    # else, including the release gate, missing secrets are a failure.
    if: github.event_name != 'pull_request'
    needs: driver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      ADBC_REPLICATE_HARDCHARGER_TEST_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      ADBC_REPLICATE_HARDCHARGER_TEST_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      ADBC_REPLICATE_HARDCHARGER_TEST_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-driver
          path: driver
      - run: pip install -e ".[dev]" driver/adbc_driver_hardcharger-*.whl
      - run: pytest tests/integration -m snowflake -v

  docker:
    # Build the image and run a real PostgreSQL → Hardcharger replication with it.
    needs: driver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: source
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # wheels/ is where the image build finds packages that aren't on PyPI yet.
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-driver
          path: wheels
      - run: rm wheels/*.tar.gz && ls wheels
      - run: docker build -t adbc-replicate-hardcharger:ci .
      - run: docker run --rm adbc-replicate-hardcharger:ci --version
      - run: docker run --rm --entrypoint test adbc-replicate-hardcharger:ci -s /opt/adbc-replicate-hardcharger/THIRD_PARTY_NOTICES.txt
      - name: Seed PostgreSQL
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d source -v ON_ERROR_STOP=1 -c "
            CREATE SCHEMA app;
            CREATE TABLE app.items AS SELECT i AS id, 'item ' || i AS name, i * 1.5::numeric(10,2) AS price
            FROM generate_series(1, 1000) i;
            CREATE VIEW app.cheap AS SELECT id, name FROM app.items WHERE price < 100;"
      - name: Replicate with the image
        run: |
          cat > /tmp/replicate.yaml <<'EOF'
          version: 1
          source: {type: postgresql, uri: "postgresql://127.0.0.1:15432/source", username: postgres, password: "${PGPASSWORD}"}
          target: {uri: "hardcharger://127.0.0.1:31387?tls=false", username: hardcharger, password: "${HCPASSWORD}"}
          objects: [{db_schemas: [app]}]
          EOF
          for _ in 1 2 3 4 5 6; do
            docker run --rm --network host -v /tmp/replicate.yaml:/config/replicate.yaml:ro \
              -e PGPASSWORD=postgres -e HCPASSWORD=hardcharger adbc-replicate-hardcharger:ci test-connection --config /config/replicate.yaml && break
            sleep 5
          done
          docker run --rm --network host -v /tmp/replicate.yaml:/config/replicate.yaml:ro \
            -e PGPASSWORD=postgres -e HCPASSWORD=hardcharger adbc-replicate-hardcharger:ci run --config /config/replicate.yaml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/adbc-replicate-hardcharger --set config.version=1
      - run: |
          helm template demo charts/adbc-replicate-hardcharger \
            --set config.version=1 --set existingSecret=demo-env \
            --set-string 'viewOverrides.HR\.V_X\.sql=SELECT 1' > /tmp/rendered.yaml
          grep -q 'kind: CronJob' /tmp/rendered.yaml
          grep -q 'concurrencyPolicy: Forbid' /tmp/rendered.yaml
          grep -q 'karpenter.sh/do-not-disrupt' /tmp/rendered.yaml
          grep -q 'ghcr.io/gizmodata/adbc-replicate-hardcharger' /tmp/rendered.yaml
