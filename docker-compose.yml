# Test services for the integration suite (same images and ports as CI):
#   docker compose up -d --wait
#   pytest -m integration
services:
  hardcharger:
    image: ghcr.io/gizmodata/hardcharger:main
    ports: ["127.0.0.1:31387:31337"]
    environment:
      HARDCHARGER_ADMIN_USERNAME: hardcharger
      HARDCHARGER_ADMIN_PASSWORD: hardcharger
      HARDCHARGER_DATABASE: /tmp/target.duckdb

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports: ["15211:1521"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: replicate
      APP_USER_PASSWORD: replicate
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:16-alpine
    ports: ["15432:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
